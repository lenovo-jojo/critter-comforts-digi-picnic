<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
let screenMesh,screenCorners;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,1000);scene.add(new THREE.HemisphereLight(0xffffff,0x9a7799,1.4));const light=new THREE.DirectionalLight(0xffffff,1.2);light.position.set(-3,6,5);scene.add(light);
const screen=document.createElement('canvas');screen.width=640;screen.height=400;const ctx=screen.getContext('2d'),avatar=new Image();avatar.src='/assets/me-idle.gif';const texture=new THREE.CanvasTexture(screen);texture.colorSpace=THREE.SRGBColorSpace;texture.flipY=false;texture.magFilter=THREE.LinearFilter;texture.minFilter=THREE.LinearFilter;texture.generateMipmaps=false;
const osImage=new Image();osImage.src='/assets/laptop-os-current.png';
osImage.onload=()=>os();
function os(){if(osImage.complete&&osImage.naturalWidth){ctx.drawImage(osImage,0,0,640,400);texture.needsUpdate=true;}}
new GLTFLoader().load('/assets/laptop-preview.glb',g=>{const model=g.scene;model.traverse(o=>{if(o.isMesh){for(const material of (Array.isArray(o.material)?o.material:[o.material])){if(material.map){material.map.magFilter=THREE.NearestFilter;material.map.minFilter=THREE.NearestFilter;material.map.needsUpdate=true;}}}if(o.isMesh&&/screen/i.test(o.name)){const uv=o.geometry.attributes.uv,pos=o.geometry.attributes.position;o.geometry.computeBoundingBox();const box=o.geometry.boundingBox;for(let i=0;i<uv.count;i++)uv.setXY(i,1-(pos.getX(i)-box.min.x)/(box.max.x-box.min.x),1-(pos.getY(i)-box.min.y)/(box.max.y-box.min.y));uv.needsUpdate=true;screenMesh=o;screenCorners=[[1,0],[0,0],[0,1],[1,1]].map(([u,v])=>{let best=0,d=Infinity;for(let i=0;i<uv.count;i++){const n=(uv.getX(i)-u)**2+(uv.getY(i)-v)**2;if(n<d){d=n;best=i;}}return new THREE.Vector3().fromBufferAttribute(pos,best);});o.material=new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide});}});scene.add(model);const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());model.position.sub(center);const r=Math.max(size.x,size.y,size.z);camera.userData.span=r*.7;camera.position.set(-r*1.15,r*1.05,r*1.45);camera.lookAt(0,0,0);camera.updateMatrixWorld();const bounds=new THREE.Box3().setFromObject(model),viewBounds=new THREE.Box3();for(const x of [bounds.min.x,bounds.max.x])for(const y of [bounds.min.y,bounds.max.y])for(const z of [bounds.min.z,bounds.max.z])viewBounds.expandByPoint(new THREE.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse));camera.userData.halfWidth=Math.max(Math.abs(viewBounds.min.x),Math.abs(viewBounds.max.x));camera.userData.halfHeight=Math.max(Math.abs(viewBounds.min.y),Math.abs(viewBounds.max.y));camera.near=r/100;camera.far=r*30;camera.updateProjectionMatrix();},undefined,e=>console.error(e));
function frame(){const w=innerWidth,h=innerHeight;if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);const span=Math.max(camera.userData.halfHeight||1,(camera.userData.halfWidth||1)*h/w)*1.12;camera.left=-span*w/h;camera.right=span*w/h;camera.top=span;camera.bottom=-span;camera.updateProjectionMatrix();if(osImage.complete&&!texture.userData.loaded){os();texture.userData.loaded=!!osImage.naturalWidth;}renderer.render(scene,camera);requestAnimationFrame(frame);}frame();
</script></body></html>
