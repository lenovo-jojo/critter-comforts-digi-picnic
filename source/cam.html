<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:22px VT323,monospace;color:#ffeaf5;background:#889dcc url('/assets/campov.gif') center/cover;image-rendering:pixelated;display:flex;flex-direction:column;padding:20px;gap:14px}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,#49324b12 3px 4px);z-index:5}.camera-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#4e395de8;border:2px solid #f5bdde;box-shadow:4px 4px #49324b60}.camera-name{letter-spacing:2px}.live-dot{display:inline-block;width:8px;height:8px;background:#ffa1c9;box-shadow:0 0 10px #ffa1c9;margin-right:9px}.camera-actions{display:flex;gap:8px;align-items:center}button,a{font:20px VT323,monospace;color:inherit;background:#765f90;border:1px solid #e5bed5;padding:4px 10px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b7f8d7;outline-offset:3px}button:hover,a:hover{background:#a16e9f}.viewfinder{flex:1;min-height:0;position:relative;padding:22px;background:#42385280;border:2px solid #ffeaf5;box-shadow:6px 6px #4e395d66}.photo-window{height:100%;width:100%;background:#fff0f8;border:6px solid #ffeaf5;box-shadow:0 0 0 2px #a679a4;overflow:hidden}.photo-window iframe{display:block;width:100%;height:100%;border:0;background:#fff}.corner{position:absolute;width:15px;height:15px;border:3px solid #b7f8d7;pointer-events:none}.tl{top:7px;left:7px;border-right:0;border-bottom:0}.tr{top:7px;right:7px;border-left:0;border-bottom:0}.bl{bottom:7px;left:7px;border-right:0;border-top:0}.br{bottom:7px;right:7px;border-left:0;border-top:0}.camera-footer{display:flex;justify-content:space-between;font-size:18px;text-shadow:1px 2px #49324b}body.wide{padding:8px;gap:8px}body.wide .viewfinder{padding:8px}body.wide .corner{display:none}@media(max-width:600px){body{padding:10px;gap:9px}.camera-bar{padding:8px;flex-wrap:wrap}.camera-actions{margin-left: <body>
