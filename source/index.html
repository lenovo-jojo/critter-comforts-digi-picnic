<!-- /index.html (IG overlay scrollable) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>jolie's virtual picnic</title>
  <link rel="icon" href="/assets/tab.png" type="image/png"/>
  <link href="/style.css" rel="stylesheet" type="text/css"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"/>

  <style>
    :root { --pink:#ff99cc; --hot:#ff69b4; --sky:#87ceeb; }
    * { box-sizing: border-box; }
    body {
      margin:0; padding:0; overflow:hidden;
      background:linear-gradient(to right,#87ceeb 0%,#87ceeb 40%,#aaaaaa 60%,#666 100%);
      font-family:'Comic Sans MS', ui-rounded, system-ui, sans-serif;
      color:var(--pink); cursor:url('/assets/cursor.gif'), auto;
    }

    .main-container { position:relative; width:100vw; height:100vh; perspective:800px; overflow:visible; }
    .bg-image { position:absolute; inset:0; background:url('/assets/bg.png') center/cover no-repeat; z-index:0; }

    .laptop,.cam-img,.phone-img,.me-img,.boombox { position:absolute; cursor:pointer; transition:transform .2s ease, filter .2s ease; }

    .laptop { top:62%; left:35%; width:10vw; max-width:150px; z-index:3; transform:translate(-50%,-50%); filter:grayscale(40%); }
    .laptop:hover { filter:saturate(120%) brightness(115%); transform:translate(-50%,-50%) scale(1.05); }

    .cam-img { top:73%; left:39%; width:8vw; max-width:120px; z-index:3; transform:translate(-50%,-50%); }
    .cam-img:hover { filter:saturate(120%) brightness(115%); transform:translate(-50%,-50%) scale(1.1); }

    /* phone: half-sized mirror of camera */
    .phone-img { top:73%; left:57%; width:4vw; max-width:60px; z-index:3; transform:translate(-50%,-50%); }
    .phone-img:hover { filter:saturate(120%) brightness(115%); transform:translate(-50%,-50%) scale(1.1); }

    /* avatar (double-buffer stack to prevent blink) */
    .me-img{
      top:60%; left:48%; width:25vw; max-width:300px; transform:translate(-50%,-50%) scale(.8);
      opacity:1; transition:opacity .12s ease, transform .2s ease, filter .2s ease;
      z-index:4; will-change:opacity; backface-visibility:hidden;
    }
    .me-img:hover{ transform:translate(-50%,-50%) scale(.85); }
    video.me-img { object-fit:contain; }

    .boombox { top:62%; left:62%; width:12vw; max-width:150px; z-index:5; transform:translate(-50%,-50%) scale(.8) rotateY(-25deg); }
    .boombox:hover,.boombox.sleeping:hover { transform:translate(-50%,-50%) scale(.9) rotateY(-25deg); }
    @keyframes floatSleepy{
      0%,100%{ transform:translate(-50%,-50%) scale(.8) rotateY(-25deg) translateY(0); }
      50%{ transform:translate(-50%,-50%) scale(.8) rotateY(-25deg) translateY(-5px); }
    }
    .boombox.sleeping { animation:floatSleepy 3s ease-in-out infinite; filter:grayscale(100%); }
    .zzz{ position:absolute; top:55%; left:62%; transform:translate(-50%,-100%); font-size:1.4rem; color:#ccc; z-index:6; pointer-events:none; display:none; }

    .sunshine{
      position:absolute; top:7.5%; left:6%; width:14vw; max-width:180px; z-index:2; overflow:visible; cursor:pointer;
      filter:grayscale(40%); animation:rock 4s ease-in-out infinite; transition:transform .3s ease, filter .3s ease; transform-origin:center;
      -webkit-mask-image:url('/assets/sunshine.png'); mask-image:url('/assets/sunshine.png'); -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
      -webkit-mask-position:center; mask-position:center; -webkit-mask-size:100% 100%; mask-size:100% 100%;
    }
    .sunshine:hover{ transform:scale(1.1); filter:saturate(120%) brightness(115%); }
    @keyframes rock{ 0%{rotate:-2deg} 50%{rotate:2deg} 100%{rotate:-2deg} }

    #sun-video-overlay{ position:absolute; inset:0; z-index:3; display:none; }
    #sun-video-overlay iframe{ width:200%; height:200%; transform:translate(-25%,-25%); border:0; }

    .logo-circle{ position:absolute; top:8%; right:12%; width:10vw; max-width:170px; z-index:10001; }
    .logo-img{ width:100%; display:block; animation:rock 5s ease-in-out infinite; filter:saturate(120%) brightness(115%); z-index:10002; }
    .hoop-text{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:200%; height:200%; overflow:visible; animation:spin-text 20s linear infinite; z-index:10002; }
    @keyframes spin-text{ from{ transform:translate(-50%,-50%) rotate(0deg) } to{ transform:translate(-50%,-50%) rotate(360deg) } }

    #music-popup{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; justify-content:center; align-items:center; z-index:999; }
    #music-popup .popup-bubble{
      background:#fff; color:#ff69b4; padding:1rem 3rem; border:4px solid var(--pink); border-radius:40px; text-align:center;
      box-shadow:5px 5px 0 var(--pink); transform:translate(-40px,-180px); max-width:600px;
    }
    #music-popup button{ margin:1rem; padding:.5rem 1.2rem; border:0; border-radius:20px; background:var(--pink); color:#fff; cursor:pointer; }
    #music-popup button:hover{ background:var(--hot); }

    #hint{
      position:absolute; bottom:10%; left:50%; transform:translateX(-50%);
      font-size:1.2rem; color:#fff; background:rgba(0,0,0,.4); padding:.5rem 1rem; border-radius:10px; display:none;
    }

    /* overlays (cam + laptop + phone) */
    #cam-overlay,#laptop-overlay,#phone-overlay{
      position:fixed; inset:0; width:100vw; height:100vh; background:rgba(0,0,0,.8);
      display:none; justify-content:center; align-items:center; z-index:9999;
      overscroll-behavior: contain; /* avoid background bounce */
    }
    .cam-frame,.laptop-frame{
      width:80vw; height:80vh; background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 0 30px #000; position:relative;
    }
    .cam-frame iframe,.laptop-frame iframe{ width:100%; height:100%; border:0; border-radius:20px; }

    /* Instagram frame: SCROLLABLE */
    .ig-frame{
      width:min(92vw, 620px);
      height:85vh;                 /* fixed height enables scroll */
      background:#fff; border-radius:20px;
      overflow:auto;               /* key */
      -webkit-overflow-scrolling:touch; /* momentum on iOS */
      box-shadow:0 0 30px #000; position:relative;
      touch-action: pan-y;
    }
    .ig-embed-wrap{ padding:8px; min-height:100%; }
    .ig-frame .close-phone{
      position:absolute; top:8px; right:12px; background:var(--pink); border:0; color:#fff; font-size:1.2rem; padding:5px 10px; cursor:pointer; border-radius:5px; z-index:10;
    }
    .ig-frame .close-phone:hover{ background:var(--hot); }
    blockquote.instagram-media{ margin:0 !important; max-width:100% !important; width:100% !important; }

    /* pixel speech bubble (wide & short) */
    .speech{
      position:fixed; z-index:10000; pointer-events:auto; cursor:pointer;
      font-family:"Press Start 2P","VT323",ui-monospace,monospace;
      font-size:clamp(10px,1.6vw,13px);
      line-height:1.2; letter-spacing:.25px; color:#fff;
      background:#000; padding:8px 18px; border:0; border-radius:0;
      box-shadow:0 0 0 2px #fff inset, 0 0 0 2px #fff, 0 0 0 6px #000, 6px 6px 0 0 #000;
      image-rendering:pixelated; user-select:none; display:none;
      width:clamp(360px, 70vw, 740px);
      text-align:left; white-space:pre-wrap; transform:translate(-50%,-100%);
    }
    .speech::after{
      content:""; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%) rotate(45deg);
      width:16px; height:16px; background:#000; box-shadow:0 0 0 2px #fff;
    }
    #speech-text{ display:block; word-break:break-word; }
    .speech .tap-indicator{
      margin-top:.35rem; font-size:.8rem; color:#bbb; text-align:center;
      user-select:none; pointer-events:none; letter-spacing:.02em;
      animation:blink 1.1s ease-in-out infinite; min-height:1em; visibility:hidden;
    }
    @keyframes blink{ 0%,100%{opacity:.25; transform:translateY(0)} 50%{opacity:1; transform:translateY(-2px)} }

    @media (prefers-reduced-motion:reduce){
      .sunshine,.logo-img,.hoop-text,.boombox.sleeping{ animation:none !important; }
      .speech .tap-indicator{ animation:none !important; opacity:.7; }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="bg-image"></div>

    <img src="/assets/laptop.gif" alt="laptop" class="laptop" id="laptop"/>
    <img src="/assets/cam.png" alt="camera" class="cam-img" id="camera"/>
    <img src="/assets/phone.png" alt="phone" class="phone-img" id="phone"/>

    <!-- avatar (DOUBLE-BUFFER images + optional bob video) -->
    <img src="/assets/me-idle.gif" alt="me" class="me-img" id="me-img-a"/>
    <img src="/assets/me-idle.gif" alt="" class="me-img" id="me-img-b" aria-hidden="true" style="display:none; opacity:0;"/>
    <video id="me-bob-video" class="me-img" muted loop playsinline style="display:none; opacity:0;">
      <source src="/assets/me-bob.webm" type="video/webm"/>
      <source src="/assets/me-bob.mp4" type="video/mp4"/>
    </video>

    <img src="/assets/boombox.png" alt="boombox" id="boombox" class="boombox" onclick="toggleMusic()"/>
    <div id="zzz" class="zzz">z z z ...</div>

    <div id="speech" class="speech">
      <span id="speech-text"></span>
      <div id="tap-ind" class="tap-indicator">▸</div>
    </div>

    <div class="sunshine" id="sun">
      <img src="/assets/sunshine.png" alt="sun" style="width:100%;height:auto"/>
      <div id="sun-video-overlay">
        <iframe id="sun-yt"
          src="https://www.youtube.com/embed/XC7H7FtUhJc?autoplay=1&mute=1&rel=0&controls=0&modestbranding=1&playsinline=1"
          allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>

    <img src="/assets/blank.png" class="floating-sticker" style="position:absolute; bottom:10%; right:5%"/>

    <div class="logo-circle">
      <img src="/assets/heart-logo.png" alt="logo" class="logo-img"/>
      <svg viewBox="0 0 500 500" class="hoop-text">
        <defs><path id="circlePath" d="M250,250 m-160,0 a160,160 0 1,1 320,0 a160,160 0 1,1 -320,0"/></defs>
        <text font-size="21" fill="#ff99cc" font-family="'Comic Sans MS', cursive" text-anchor="middle">
          <textPath xlink:href="#circlePath" startOffset="50%">
            connoisseur of all things sad and pretty ✮ ⋆ ˚｡𖦹 ⋆ connoisseur of all things sad and pretty ✮ ⋆ ˚｡𖦹 ⋆｡
          </textPath>
        </text>
      </svg>
    </div>

    <iframe id="sc-player" style="width:1px;height:1px;border:0;position:absolute;bottom:0;left:0;" frameborder="no" allow="autoplay"></iframe>
  </div>

  <!-- Camera overlay -->
  <div id="cam-overlay">
    <div class="cam-frame">
      <button class="close-cam" id="close-cam">✖</button>
      <iframe src="cam.html" title="Camera View"></iframe>
    </div>
  </div>

  <!-- Laptop overlay -->
  <div id="laptop-overlay">
    <div class="laptop-frame">
      <button class="close-laptop" id="close-laptop">✖</button>
      <iframe src="laptop1.html" title="Laptop"></iframe>
    </div>
  </div>

  <!-- Phone overlay -->
  <div id="phone-overlay">
    <div class="ig-frame">
      <button class="close-phone" id="close-phone">✖</button>
      <iframe src="phone.html" title="Phone window"
              style="width:100%; height:100%; border:0;"></iframe>
    </div>
  </div>

  <div id="music-popup">
    <div class="popup-bubble">
      <p>hi! welcome to my virtual picnic.<br/>can i have the aux?👉👈</p>
      <button id="music-yes">yes</button>
      <button id="music-no">no</button>
    </div>
  </div>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script async src="https://www.instagram.com/embed.js"></script>

  <script>
    let boombox, widget, widgetReady = false, isPlaying = false;
    let tracks = [], unusedIndexes = [];
    const zzz = document.getElementById('zzz');
    const hint = document.getElementById('hint');

    /* avatar state + fade/video (double-buffer) */
    let meImgA = null, meImgB = null, activeImg = null, bufferImg = null, meVideo = null;
    let meMode = 'idle2';
    let currentKind = 'img';
    const IDLE2_DELAY = 10000;
    const BOB_TO_DANCE = 30000;
    const BOB_RATE = 0.8;
    let idle2Timer = null, bobDanceTimer = null;
    const FADE_MS = 120;
    let spriteSwitchToken = 0;

    function spriteSrcForMode(mode){
      if (mode === 'idle2') return { kind:'img', src:'/assets/me-idle.gif' };
      if (mode === 'idle')  return { kind:'img', src:'/assets/me-sit.gif' };
      if (mode === 'talk')  return { kind:'img', src:'/assets/me-talk.gif' };
      if (mode === 'dance') return { kind:'img', src:'/assets/me.gif' };
      if (mode === 'bob')   return { kind:'img', src:'/assets/me-bob.gif' };
      return { kind:'img', src:'/assets/me-sit.gif' };
    }

    function swapImgRefs(){ const t = activeImg; activeImg = bufferImg; bufferImg = t; }

    async function crossfadeToImage(newSrc){
      const token = ++spriteSwitchToken;
      bufferImg.style.display = 'block';
      bufferImg.style.opacity = 0;
      const startShow = () => {
        if (token !== spriteSwitchToken) return;
        requestAnimationFrame(() => {
          bufferImg.style.opacity = 1;
          activeImg.style.opacity = 0;
          setTimeout(() => {
            if (token !== spriteSwitchToken) return;
            activeImg.style.display = 'none';
            swapImgRefs();
          }, FADE_MS);
        });
      };
      if (bufferImg.getAttribute('src') !== newSrc) bufferImg.src = newSrc;
      if ('decode' in bufferImg) { bufferImg.decode().then(startShow).catch(startShow); }
      else { bufferImg.addEventListener('load', startShow, { once:true }); }
    }

    function crossfade(fromEl, toEl, prepareToEl){
      const token = ++spriteSwitchToken;
      if (prepareToEl) prepareToEl();
      toEl.style.display = 'block'; toEl.style.opacity = 0;
      fromEl.style.opacity = 1;
      requestAnimationFrame(() => {
        toEl.style.opacity = 1; fromEl.style.opacity = 0;
        setTimeout(() => { if (token !== spriteSwitchToken) return; fromEl.style.display = 'none'; }, FADE_MS);
      });
    }

    function prepareActiveImage(newSrc){
      if (activeImg.getAttribute('src') !== newSrc) activeImg.src = newSrc;
      activeImg.style.display = 'block';
      activeImg.style.opacity = 0;
    }

    function setMeMode(mode){
      if (!activeImg || !meVideo || meMode === mode) return;
      const to = spriteSrcForMode(mode);
      const fromKind = currentKind;
      meMode = mode;

      if (to.kind === 'img' && fromKind === 'img'){
        crossfadeToImage(to.src);
        currentKind = 'img';
        meVideo.pause(); meVideo.style.display='none'; meVideo.style.opacity=0;
        return;
      }
      if (to.kind === 'video' && fromKind === 'video'){
        meVideo.playbackRate = BOB_RATE; meVideo.muted = true;
        meVideo.play().catch(()=>{});
        meVideo.style.display='block'; meVideo.style.opacity=1;
        return;
      }
      if (to.kind === 'video' && fromKind === 'img'){
        crossfade(activeImg, meVideo, () => {
          meVideo.currentTime = 0; meVideo.playbackRate = BOB_RATE; meVideo.muted = true; meVideo.play().catch(()=>{});
        });
        currentKind = 'video';
        return;
      }
      if (to.kind === 'img' && fromKind === 'video'){
        prepareActiveImage(to.src);
        crossfade(meVideo, activeImg, () => { meVideo.pause(); });
        currentKind = 'img';
        return;
      }
    }

    function clearIdle2Timer(){ if (idle2Timer){ clearTimeout(idle2Timer); idle2Timer = null; } }
    function scheduleIdle2Timer(){ if (isPlaying) return; clearIdle2Timer(); idle2Timer = setTimeout(() => { if (!isPlaying && meMode !== 'talk' && !isBetweenLines()) setMeMode('idle2'); }, IDLE2_DELAY); }
    function clearBobDanceTimer(){ if (bobDanceTimer){ clearTimeout(bobDanceTimer); bobDanceTimer = null; } }
    function startBobDanceCycle(){ if (!isPlaying || meMode === 'talk' || isBetweenLines()) return; setMeMode('bob'); clearBobDanceTimer(); bobDanceTimer = setTimeout(() => { if (isPlaying && meMode !== 'talk' && !isBetweenLines()) setMeMode('dance'); }, BOB_TO_DANCE); }

    /* Animalese */
    let audioCtx = null, animaleseBuffer = null, triedAnimalese = false;
    async function ensureAudioReady(){
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      if (!triedAnimalese && !animaleseBuffer){ triedAnimalese = true; await loadAnimaleseSample(); }
    }
    async function loadAnimaleseSample(){
      const urls = ["/assets/animalese.wav", "/audio/animalese.wav"];
      for (const url of urls){
        try { const res = await fetch(url, { mode:"cors", cache:"force-cache" }); if (!res.ok) continue;
          const ab = await res.arrayBuffer(); animaleseBuffer = await audioCtx.decodeAudioData(ab); return;
        } catch(e){}
      }
      console.warn("Animalese sample not found/decodable. Falling back to oscillator.");
    }
    function rateForChar(ch){ const idx = ch.toLowerCase().charCodeAt(0) - 97; if (idx < 0 || idx > 25) return 1.8; return 1.6 + (idx / 25) * 0.8; }
    function freqForChar(ch){ const idx = ch.toLowerCase().charCodeAt(0) - 97; const base = 440; if (idx < 0 || idx > 25) return 520; return base * Math.pow(2, (idx % 12) / 12); }
    function playPhonemeForChar(ch){
      if (!audioCtx || /\s/.test(ch)) return;
      const now = audioCtx.currentTime, gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      if (animaleseBuffer){
        const src = audioCtx.createBufferSource();
        src.buffer = animaleseBuffer; src.playbackRate.value = rateForChar(ch);
        src.connect(gain).connect(audioCtx.destination); src.start(now); src.stop(now + 0.15);
      } else {
        const osc = audioCtx.createOscillator();
        osc.type = "square"; osc.frequency.setValueAtTime(freqForChar(ch), now);
        osc.connect(gain).connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.12);
      }
    }

    /* Dialogue */
    const speechEl    = document.getElementById('speech');
    const speechTextEl= document.getElementById('speech-text');
    const tapIndEl    = document.getElementById('tap-ind');
    const lines = [
      "hi! i'm jolie. welcome to the picnic!",
      "i hope you've had a nice day so far!",
      "i've mostly been tinkering about around here lately...",
      "the boombox plays music if you click it",
      "and there's a chatroom on my laptop if you want to leave a message!",
      "in the meantime feel free to hang out and take a load off",
      null,
      "things are always changing so come check in on me for updates :3",
      null
    ];
    let hasStarted = false, idx = -1, isTyping = false, typingInterval = null, currentFullText = "";

    function positionSpeechBubble(){
      const r = activeImg.getBoundingClientRect();
      const x = r.left + r.width * 0.5; const y = r.top - 8;
      speechEl.style.left = `${x}px`; speechEl.style.top = `${y}px`;
    }
    function showTapIndicator(show){ tapIndEl.style.visibility = show ? "visible" : "hidden"; }
    function isBetweenLines(){ return speechEl.style.display === 'block' && !isTyping; }
    function finishTypingNow(){ if (!isTyping) return; clearInterval(typingInterval); speechTextEl.textContent = currentFullText; isTyping = false; showTapIndicator(true); setMeMode('idle'); }
    function typeWriter(text, speed = 28){
      isTyping = true; currentFullText = text; speechTextEl.textContent = ""; speechEl.style.display = "block"; showTapIndicator(false); positionSpeechBubble();
      setMeMode('talk');
      const chars = Array.from(text); let i = 0;
      clearInterval(typingInterval);
      typingInterval = setInterval(() => {
        if (i >= chars.length){ clearInterval(typingInterval); isTyping = false; showTapIndicator(true); setMeMode('idle'); return; }
        const ch = chars[i++]; speechTextEl.textContent += ch; playPhonemeForChar(ch);
      }, speed);
    }
    function showLine(){
      const text = lines[idx % lines.length];
      if (text == null){
        speechEl.style.display = 'none'; isTyping = false; showTapIndicator(false); setMeMode('idle');
        if (isPlaying){ startBobDanceCycle(); } else { scheduleIdle2Timer(); }
        return;
      }
      typeWriter(text);
    }
    async function startOrAdvanceDialogue(){
      await ensureAudioReady();
      if (!hasStarted){ hasStarted = true; idx = 0; showLine(); return; }
      if (isTyping){ finishTypingNow(); return; }
      idx = (idx + 1) % lines.length; showLine();
    }

    /* Sun overlay toggle */
    const sunOverlay = document.getElementById('sun-video-overlay');
    const sunIframe  = document.getElementById('sun-yt');
    function toggleSun(){
      const visible = sunOverlay.style.display === 'block';
      if (visible) { const url = sunIframe.src; sunIframe.src = 'about:blank'; sunOverlay.style.display = 'none'; setTimeout(() => { sunIframe.src = url; }, 50); }
      else { sunOverlay.style.display = 'block'; }
    }

    /* helpers */
    function openLaptop(){ document.getElementById('laptop-overlay').style.display = 'flex'; }
    function closeLaptop(){ document.getElementById('laptop-overlay').style.display = 'none'; }
    function closeCam(){ document.getElementById('cam-overlay').style.display = 'none'; }
    function openPhone(){
      const o = document.getElementById('phone-overlay');
      o.style.display = 'flex';
      if (window.instgrm && instgrm.Embeds && typeof instgrm.Embeds.process === 'function'){
        try { instgrm.Embeds.process(); } catch(_) {}
      }
    }
    function closePhone(){ document.getElementById('phone-overlay').style.display = 'none'; }

    /* SC shuffle */
    function refillShuffle(){ unusedIndexes = tracks.map((_, i) => i); }
    function randomIndex(){ if (unusedIndexes.length === 0) refillShuffle(); const r = Math.floor(Math.random() * unusedIndexes.length); return unusedIndexes.splice(r, 1)[0]; }
    function playSoundcloudRandom(){ if (!widgetReady) return; const idx = randomIndex(); if (typeof widget.skip === 'function') widget.skip(idx); else if (typeof widget.next === 'function') widget.next(); widget.play(); startBobDanceCycle(); }
    function playNext(){
      if (!widgetReady) return;
      playSoundcloudRandom();
      boombox.src = '/assets/boombox.gif?' + Date.now();
      isPlaying = true; if (hint) hint.style.display = 'none'; boombox.classList.remove('sleeping'); zzz.style.display = 'none';
      clearIdle2Timer(); startBobDanceCycle();
    }
    function toggleMusic(){
      if (!widget) return;
      if (!isPlaying) {
        if (!widgetReady) { widget.play(); boombox.src = '/assets/boombox.gif?' + Date.now(); isPlaying = true; }
        else { playNext(); }
        if (hint) hint.style.display = 'none'; boombox.classList.remove('sleeping'); zzz.style.display = 'none';
        clearIdle2Timer(); startBobDanceCycle();
      } else {
        widget.pause(); boombox.src = '/assets/boombox.png'; isPlaying = false; boombox.classList.add('sleeping'); zzz.style.display = 'block';
        clearBobDanceTimer(); setMeMode('idle'); scheduleIdle2Timer();
      }
    }

    window.addEventListener('load', () => {
      boombox = document.getElementById('boombox');
      meImgA  = document.getElementById('me-img-a');
      meImgB  = document.getElementById('me-img-b');
      meVideo = document.getElementById('me-bob-video');
      activeImg = meImgA; bufferImg = meImgB;

      setMeMode('idle2');
      boombox.classList.add('sleeping'); zzz.style.display = 'block';

      /* Music gate */
      const popup = document.getElementById('music-popup');
      document.getElementById('music-yes').addEventListener('click', () => {
        popup.style.display = 'none'; if (hint) hint.style.display = 'block';
        const scIframe = document.getElementById('sc-player');
        scIframe.src = "https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/joliesarro/sets/10_yr_town&color=%23ff99cc&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false";
        scIframe.onload = () => {
          if (!window.SC || !SC.Widget) { if (hint) hint.textContent = "SoundCloud failed to load."; return; }
          widget = SC.Widget(scIframe);
          widget.bind(SC.Widget.Events.READY, () => {
            widget.getSounds((s) => { tracks = Array.isArray(s) ? s : []; refillShuffle(); widgetReady = true; });
          });
          widget.bind(SC.Widget.Events.FINISH, playNext);
          widget.bind(SC.Widget.Events.PLAY, () => {
            isPlaying = true; if (hint) hint.style.display = 'none'; boombox.classList.remove('sleeping'); zzz.style.display = 'none';
            clearIdle2Timer(); startBobDanceCycle();
          });
          widget.bind(SC.Widget.Events.PAUSE, () => {
            isPlaying = false; clearBobDanceTimer(); setMeMode('idle'); boombox.classList.add('sleeping'); zzz.style.display = 'block'; scheduleIdle2Timer();
          });
        };
      });
      document.getElementById('music-no').addEventListener('click', () => { popup.style.display = 'none'; });

      /* Keyboard */
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); playNext(); }
        if (e.key === 'Escape') {
          closeCam();
          closeLaptop();
          closePhone();
          if (sunOverlay.style.display === 'block') toggleSun();
        }
      });

      /* Camera overlay */
      document.getElementById('camera').addEventListener('click', () => { document.getElementById('cam-overlay').style.display = 'flex'; });
      document.getElementById('close-cam').addEventListener('click', (e) => { e.stopPropagation(); closeCam(); });
      document.getElementById('cam-overlay').addEventListener('click', (event) => {
        const frame = document.querySelector('.cam-frame');
        if (!frame.contains(event.target)) { closeCam(); }
      });

      /* Laptop overlay */
      document.getElementById('laptop').addEventListener('click', () => { openLaptop(); });
      document.getElementById('close-laptop').addEventListener('click', (e) => { e.stopPropagation(); closeLaptop(); });
      document.getElementById('laptop-overlay').addEventListener('click', (event) => {
        const frame = document.querySelector('.laptop-frame');
        if (!frame.contains(event.target)) { closeLaptop(); }
      });

      /* Phone/Instagram overlay (scroll) */
      document.getElementById('phone').addEventListener('click', () => { openPhone(); });
      document.getElementById('close-phone').addEventListener('click', (e) => { e.stopPropagation(); closePhone(); });
      document.getElementById('phone-overlay').addEventListener('click', (event) => {
        const frame = document.querySelector('.ig-frame');
        if (!frame.contains(event.target)) { closePhone(); }
      });

      /* Sun toggle */
      document.getElementById('sun').addEventListener('click', toggleSun);

      /* Dialogue (bind to both sprite layers + video) */
      ['me-img-a','me-img-b','me-bob-video'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('click', startOrAdvanceDialogue);
      });
      document.getElementById('speech').addEventListener('click', startOrAdvanceDialogue);
      window.addEventListener('resize', positionSpeechBubble);
    });
  </script>
</body>
</html>
