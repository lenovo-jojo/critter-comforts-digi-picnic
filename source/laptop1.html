  <style>
    :root{ --pink:#ff99cc; --hot:#ff69b4; --sky:#aee3ff; --ink:#2d2630; --mint:#b7f8d7; --chrome:#ffe3f0; --win:#e6f6ff; --shadow:#d46aa5; --glass:rgba(255,255,255,.75); }
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      font-family:"VT323", system-ui, sans-serif; color:var(--ink);
      background:#f5eee6;
      image-rendering:pixelated; user-select:none;
      cursor:auto;
    }

    /* Top bar */
    .topbar{
      position:fixed; inset:0 0 auto 0; height:36px; display:flex; align-items:center; justify-content:space-between;
      background:linear-gradient(#ffd4ea,#ffc2e1); border-bottom:3px solid var(--pink); padding:0 10px; z-index:1000;
      box-shadow:0 2px 0 var(--shadow); font-family:"Press Start 2P", monospace; font-size:10px; letter-spacing:.02em;
    }
    .topbar .btn{ background:var(--pink); color:#fff; border:0; padding:6px 10px; border-radius:6px; cursor:pointer; box-shadow:2px 2px 0 #d164a0; }
    .topbar .btn:hover{ background:var(--hot); }
    .clock{ opacity:.8; }

    /* Desktop */
    #desktop[data-fit-root]{ position:relative; height:100%; padding-top:40px; overflow:hidden; }
    .icons{ position:absolute; inset:46px auto 16px 16px; width:160px; display:grid; grid-auto-rows:86px; grid-row-gap:6px; }
    .icon{
      width:120px; height:86px; padding:6px; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center;
      cursor:default; text-align:center; transition:transform .08s ease;
    }
    .icon:active{ transform:scale(.98); }
    .icon img{ width:48px; height:48px; image-rendering:pixelated; margin-bottom:6px; }
    .icon span{ background:rgba(255,255,255,.6); border:2px solid var(--pink); border-radius:8px; padding:2px 6px; font-size:16px; line-height:1; }

    /* Window */
    .window{
      position:absolute; min-width:320px; min-height:200px; width:520px; height:360px; background:var(--win);
      border:3px solid var(--pink); border-radius:14px; box-shadow:6px 6px 0 var(--shadow);
      display:flex; flex-direction:column; overflow:hidden;
    }
    .titlebar{
      height:36px; display:flex; align-items:center; justify-content:space-between; background:var(--chrome); border-bottom:3px solid var(--pink);
      cursor:move; padding:0 8px; font-family:"Press Start 2P", monospace; font-size:10px;
    }
    .titlebar .title{ display:flex; align-items:center; gap:8px; }
    .titlebar img{ width:18px; height:18px; image-rendering:pixelated; }
    .titlebar .controls{ display:flex; gap:6px; }
    .xbtn{
      width:24px; height:24px; border-radius:6px; border:0; background:var(--pink); color:#fff; cursor:pointer; box-shadow:2px 2px 0 #d164a0;
      font-family:"Press Start 2P"; font-size:12px; line-height:1;
    }
    .xbtn:hover{ background:var(--hot); }

    .content{ flex:1; overflow:auto; padding:10px; background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.75)); }

    /* Chatroom */
    .chat-wrap{ max-width:720px; margin:0 auto; }
    .chat-title{ font-family:"Press Start 2P"; font-size:16px; color:var(--hot); margin:6px 0 10px; }
    .chat-box{
      height:260px; background:#fff; border:4px solid var(--pink); border-radius:10px; overflow:auto;
      padding:8px; box-shadow:2px 2px 0 var(--shadow);
    }
    .msg{ display:flex; gap:8px; margin:6px 0; align-items:flex-start; }
    .msg .name{ font-family:"Press Start 2P"; font-size:11px; color:var(--hot); }
    .meta{ font-size:12px; opacity:.55; }
    .inp{ width:100%; border:3px solid var(--pink); border-radius:10px; padding:8px; font-size:18px; }
    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .pill{ background:var(--mint); border:2px solid var(--pink); border-radius:999px; padding:6px 10px; cursor:pointer; font-family:"Press Start 2P"; font-size:10px; }
    .pill:hover{ filter:brightness(0.95); }
    .send{ background:var(--pink); color:#fff; border:0; border-radius:10px; padding:8px 14px; font-family:"Press Start 2P"; font-size:12px; box-shadow:2px 2px 0 #d164a0; cursor:pointer; }
    .send:hover{ background:var(--hot); }

    /* Game */
    .hud{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; }
    .hud .val{ font-family:"Press Start 2P"; font-size:12px; background:#fff; border:2px solid var(--pink); border-radius:8px; padding:4px 8px; }

    /* Focus ring */
    .window.focus{ box-shadow:0 0 0 3px var(--mint), 6px 6px 0 var(--shadow); }

    /* Mobile */
    @media (max-width: 720px){
      .window{ width:92vw; left:4vw !important; }
      .icons{ position:static; display:flex; gap:8px; padding:10px; width:auto; }
    }

  <script>
    // Back to picnic (more robust)
    document.getElementById('backBtn').addEventListener('click', () => {
      let done = false;
      try {
        if (window.parent && window.parent !== window && typeof window.parent.closeLaptop === 'function') {
          window.parent.closeLaptop(); done = true;
        }
      } catch(_) {}
      if (!done) {
        try { window.top.location.href = '/'; } catch(_) { window.location.href = '/'; }
      }
    });

    // Clock
    const clockEl = document.getElementById('clock');
    function tickClock(){ clockEl.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
    tickClock(); setInterval(tickClock, 1000);

    // Desktop icon opens
    document.querySelectorAll('.icon').forEach(i => {
      i.addEventListener('dblclick', () => openWin(i.dataset.open));
      i.addEventListener('click', () => openWin(i.dataset.open));
    });

    // Windows: drag/focus/persist
    const WKEY = 'vtl_window_pos';
    let state = {}; try { state = JSON.parse(localStorage.getItem(WKEY) || '{}') || {}; } catch (_) {}
    const zbase = 2000; let zacc = zbase;

    function openWin(sel){
      const w = document.querySelector(sel);
      if (!w) return;
      w.style.display = 'flex';
      focusWin(w);
      fitWindow(w);
      saveDefaultIfMissing(w);
      syncTasks();
      if(w.id==='win-tv'){setTVMode(false);tuneTV();}if(document.documentElement.dataset.desktopReady==='yes')saveDesktop();
      if (w.id === 'win-chat') setTimeout(() => document.getElementById('chat-msg')?.focus(), 0);
    }
    function closeWin(el){ if(el.id==="win-tv") document.getElementById("tv-player").removeAttribute("src"); el.style.display="none"; syncTasks();saveDesktop(); }
    function focusWin(el){
      document.querySelectorAll('.window').forEach(w => w.classList.remove('focus'));
      el.classList.add('focus'); el.style.zIndex = ++zacc;
    }
    function saveDefaultIfMissing(w){
      const id = w.id;
      if (!state[id]){
        state[id] = { left: w.style.left || '160px', top: w.style.top || '120px' };
        localStorage.setItem(WKEY, JSON.stringify(state));
      }
    }
    function applySavedPositions(){
      for (const [id, p] of Object.entries(state)){
        const w = document.getElementById(id); if (!w) continue;
        if (p.left) w.style.left = p.left;
        if (p.top)  w.style.top  = p.top;
      }
    }

    function makeDraggable(winEl){
      const bar = winEl.querySelector('.titlebar');
      let sx=0, sy=0, sl=0, st=0, dragging=false;

      bar.addEventListener('pointerdown', (e) => {
        // why: don't start drag from interactive controls
        if (e.target.closest('[data-nodrag],button,[data-close],a,input,textarea,select,[contenteditable]')) return;
        dragging = true;
        bar.setPointerCapture(e.pointerId);
        sx = e.clientX; sy = e.clientY;
        sl = parseInt(winEl.style.left || 0, 10);
        st = parseInt(winEl.style.top  || 0, 10);
        focusWin(winEl);
      });

      bar.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        winEl.style.left = (sl + (e.clientX - sx)) + 'px';
        winEl.style.top  = (st + (e.clientY - sy)) + 'px';
        fitWindow(winEl);
      });

      const end = (e) => {
        if (!dragging) return;
        dragging=false; try{ bar.releasePointerCapture(e.pointerId); }catch(_){}
        state[winEl.id] = { left:winEl.style.left, top:winEl.style.top };
        localStorage.setItem(WKEY, JSON.stringify(state));saveDesktop();
      };
      bar.addEventListener('pointerup', end);
      bar.addEventListener('pointercancel', end);

      winEl.addEventListener('mousedown', () => focusWin(winEl));
    }

    document.querySelectorAll('.window').forEach(w => makeDraggable(w));
    applySavedPositions();
    document.querySelectorAll('.window').forEach(fitWindow);
    document.querySelectorAll('.window').forEach(w => w.style.display = 'none'); // start hidden
    // Start on the desktop; choose an app to open.

    // --- Dedicated titlebar close handler (prevents drag swallowing) ---
    document.querySelectorAll('.titlebar [data-close]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation(); // why: avoid any drag/click interference
        const win = btn.closest('.window');
        if (win) closeWin(win);
      });
    });

    // Universal close (restricted to [data-close] only)
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-close]');
      if (!btn) return;
      // Titlebar X → close window
      const bar = btn.closest('.titlebar');
      if (bar){
        const win = btn.closest('.window');
        if (win) closeWin(win);
        return;
      }
      // Subpanel/card/tab close
      const panel =
        btn.closest('[data-closable]') ||
        btn.closest('.subtab') ||
        btn.closest('[role="tabpanel"]') ||
        btn.closest('.tab-panel') ||
        btn.closest('.panel') ||
        btn.closest('.card');

      if (panel){ panel.style.display = 'none'; return; }

      // Fallback: closest window
      const win = btn.closest('.window');
      if (win) closeWin(win);
    });

    /* ---- Chatroom (localStorage) ---- */
    const CHAT_KEY = 'vtl_chat_v1';
    const NAME_KEY = 'vtl_chat_name';
    const box  = document.getElementById('chat-box');
    const name = document.getElementById('chat-name');
    const msg  = document.getElementById('chat-msg');
    const send = document.getElementById('chat-send');

    name.value = localStorage.getItem(NAME_KEY) || '';
    function loadChat(){ try{ return JSON.parse(localStorage.getItem(CHAT_KEY) || '[]'); }catch(_){ return []; } }
    function saveChat(arr){ localStorage.setItem(CHAT_KEY, JSON.stringify(arr)); }
    function renderChat(){
      const list = loadChat();
      box.innerHTML = list.map(m => `
        <div class="msg">
          <div class="name">${escapeHTML(m.n || 'anon')}</div>
          <div>
            <div>${escapeHTML(m.t)}</div>
            <div class="meta">${new Date(m.ts||Date.now()).toLocaleString([], {hour:'2-digit', minute:'2-digit'})}</div>
          </div>
        </div>`).join('');
      box.scrollTop = box.scrollHeight;
    }
    function sendChat(){
      const n = name.value.trim() || 'anon';
      const t = msg.value.trim();
      if (!t) return;
      const list = loadChat();
      list.push({ n, t, ts: Date.now() });
      saveChat(list);
      localStorage.setItem(NAME_KEY, n);
      msg.value = '';
      renderChat();
    }
    function escapeHTML(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    send.addEventListener('click', sendChat);
    msg.addEventListener('keydown', (e) => { if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') sendChat(); });
    document.getElementById('clear-chat').addEventListener('click', () => {
      if (confirm('clear all messages?')){ localStorage.removeItem(CHAT_KEY); renderChat(); }
    });
    renderChat();

    /* ---- Tarot ---- */
    const SHOW_CARD_CLOSE = false; // set true if you want per-card ✕
    const DECK = [
      ["The Fool","fresh start, leap, open heart"],
      ["The Magician","skill, will, making it real"],
      ["The High Priestess","intuition, inner voice"],
      ["The Empress","care, creativity, growth"],
      ["The Emperor","structure, responsibility"],
      ["The Hierophant","tradition, guidance"],
      ["The Lovers","choice, alignment, love"],
      ["The Chariot","momentum, determination"],
      ["Strength","soft power, courage"],
      ["The Hermit","reflection, alone time"],
      ["Wheel of Fortune","cycles, change"],
      ["Justice","balance, fairness"],
      ["The Hanged One","pause, new angle"],
      ["Death","ending → beginning"],
      ["Temperance","mixing, patience"],
      ["The Devil","attachment, pattern"],
      ["The Tower","shake-up, revelation"],
      ["The Star","hope, healing"],
      ["The Moon","dreams, fog, feelings"],
      ["The Sun","joy, clarity"],
      ["Judgement","wake-up call"],
      ["The World","wholeness, completion"],
    ];
    const grid = document.getElementById('tarot-grid');
    function draw(n=3){
      const pool = [...DECK]; const picks = [];
      for (let i=0;i<n;i++){
        const idx = Math.floor(Math.random()*pool.length);
        const [name,desc] = pool.splice(idx,1)[0];
        const rev = Math.random()<0.5;
        picks.push({name, desc, rev});
      }
      grid.innerHTML = picks.map(p => `
        <div class="card" data-closable style="border:2px solid var(--pink); border-radius:12px; padding:8px; margin-top:10px; background:#fff; box-shadow:2px 2px 0 var(--shadow); transform:${p.rev?'rotate(180deg)':''}">
          <div class="row" style="justify-content:space-between; align-items:center; transform:${p.rev?'rotate(180deg)':''}">
            <div class="name">${p.name}${p.rev?' (rev)':''}</div>
            ${SHOW_CARD_CLOSE ? '<button class="xbtn" data-close type="button" aria-label="close card">✕</button>' : ''}
          </div>
          <div class="desc" style="transform:${p.rev?'rotate(180deg)':''}">${p.desc}</div>
        </div>`).join('');
    }
    document.getElementById('draw-3').addEventListener('click', () => draw(3));
    document.getElementById('reshuffle').addEventListener('click', () => { grid.innerHTML=''; });
    draw(3);

    /* ---- Game: Snake (mini) ---- */
    (function initSnake(){
      const cvs = document.getElementById('game-canvas');
      const ctx = cvs.getContext('2d');
      const scoreEl = document.getElementById('game-score');
      const hiEl = document.getElementById('game-hi');
      const toggleBtn = document.getElementById('game-toggle');
      const resetBtn = document.getElementById('game-reset');
      const HIKEY = 'vtl_snake_hi';

      const size = 20;
      const tile = cvs.width / size;
      let snake, dir, nextDir, food, score, hi, playing, lastTime, stepMs, frame = 0;
      function schedule(){ cancelAnimationFrame(frame); frame = requestAnimationFrame(loop); }

      function reset(){
        cancelAnimationFrame(frame);
        snake = [{x:10,y:10}];
        dir = {x:1,y:0}; nextDir = {x:1,y:0};
        food = spawnFood();
        score = 0; updateHUD();
        stepMs = 120;
        lastTime = 0; playing = false;
        draw();
      }
      function spawnFood(){
        while(true){
          const f = { x: Math.floor(Math.random()*size), y: Math.floor(Math.random()*size) };
          if (!snake.some(s => s.x===f.x && s.y===f.y)) return f;
        }
      }
      function updateHUD(){
        scoreEl.textContent = String(score);
        hi = Math.max(score, Number(localStorage.getItem(HIKEY) || 0));
        hiEl.textContent = String(hi);
      }
      function setDir(nx, ny){
        if (nx === -dir.x && ny === -dir.y) return; // why: prevent instant self-hit
        nextDir = {x:nx, y:ny};
      }

      toggleBtn.addEventListener('click', () => { playing = !playing; if (playing) schedule(); else cancelAnimationFrame(frame); });
      resetBtn.addEventListener('click', () => { localStorage.setItem(HIKEY, String(Math.max(hi, score))); reset(); });
      window.addEventListener('keydown', (e) => {
        if (e.target.closest('input,textarea,[contenteditable]') || document.getElementById('win-game').style.display === 'none') return;
        const k = e.key.toLowerCase();
        if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
        if (k==='arrowup' || k==='w') setDir(0,-1);
        else if (k==='arrowdown' || k==='s') setDir(0,1);
        else if (k==='arrowleft' || k==='a') setDir(-1,0);
        else if (k==='arrowright' || k==='d') setDir(1,0);
        else if (k===' ') { playing = !playing; if (playing) schedule(); else cancelAnimationFrame(frame); }
      });

      function loop(ts){
        if (!playing) return;
        if (ts - lastTime >= stepMs){
          lastTime = ts;
          dir = nextDir;
          const head = { x: (snake[0].x + dir.x + size) % size, y: (snake[0].y + dir.y + size) % size };
          const hitSelf = snake.some(s => s.x===head.x && s.y===head.y);
          if (hitSelf){
            localStorage.setItem(HIKEY, String(Math.max(hi, score)));
            playing = false;
          }else{
            snake.unshift(head);
            if (head.x===food.x && head.y===food.y){
              score++; updateHUD();
              if (stepMs > 60) stepMs -= 3;
              food = spawnFood();
            }else{
              snake.pop();
            }
          }
          draw();
        }
        frame = requestAnimationFrame(loop);
      }
