<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jolie's phone</title><link rel="icon" href="/assets/tab.png"><link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:#604565}body{padding:9px;background:transparent;display:flex;justify-content:center;align-items:center;cursor:url('/assets/cursor.gif'),auto}.phone{width:100%;height:100%;max-width:350px;max-height:690px;border:6px solid #a96588;border-radius:43px;padding:7px;background:linear-gradient(120deg,#ffe1ee,#f2accf);box-shadow:inset 0 0 0 2px #fff6,0 12px 30px #351f4333;position:relative}.screen{height:100%;border:2px solid #76516f;border-radius:30px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 80% 35%,#f9d9ef 0,transparent 48%),linear-gradient(160deg,#a9d8fa 15%,#cce8ff 50%,#fbb9df);display:flex;flex-direction:column}.screen:before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff9c 1px,transparent 1px);background-size:22px 22px}.status{height:38px;padding:12px 20px 0;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;position:relative}.speaker{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:67px;height:15px;background:#64455e;border-radius:20px;box-shadow:inset 0 2px 3px #0003}.speaker:after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:#a5c6df;margin:5px 8px}.signals{display:flex;gap:5px;align-items:center}.signals svg{width:15px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5}.welcome{position:relative;text-align:center;padding:37px 12px 24px}.date{font-size:12px;letter-spacing:.3px}.time{font-size:52px;font-weight:300;letter-spacing:-2px;margin:5px 0}.owner{font:22px VT323,monospace;margin:0}.apps{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:23px 9px;padding:15px 14px}.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:#604565;font-size:11px;min-width:0}.tile{width:57px;height:57px;display:grid;place-items:center;border:1px solid #fff9;border-radius:16px;box-shadow:0 4px 0 #77506a22,inset 0 1px 0 #fff8;transition:transform .15s;background:#fff8;color:#795370}.app:hover .tile{transform:translateY(-3px)}.app:focus-visible{outline:2px solid #785574;outline-offset:4px;border-radius:5px}.pinterest .tile{background:#f8a5c5;font:bold italic 41px Georgia,serif}.tumblr .tile{background:#b2c8e8;font:bold 43px Georgia,serif}.linkedin .tile{background:#b8dbed;font:bold 27px Arial;letter-spacing:-2px}.instagram .tile{background:linear-gradient(135deg,#d4b4ef,#f6b5d7,#ffd6aa)}.tile svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dock{position:relative;margin:auto 15px 23px;border:1px solid #fff8;border-radius:23px;background:#fff6;padding:14px 12px;display:flex;justify-content:space-around}.dock .tile{width:48px;height:48px;border-radius:14px}.home-line{width:90px;height:4px;background:#795370;border-radius:5px;position:absolute;bottom:9px;left:50%;transform:translateX(-50%)}.close{position:absolute;right:-7px;top:-7px;z-index:3;border:2px solid #a96588;background:#fff0f8;color:#795370;width:30px;height:30px;border-radius:50%;font:23px Arial;cursor:pointer}.close:hover{background:#ffc6e5}@media(max-height:530px){.welcome{padding:15px 10px 8px}.time{font-size:38px}.apps{gap:14px;padding-top:8px}.dock{margin-bottom:18px;padding:8px}.tile{width:48px;height:48px}}@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style></head>
<body><main class="phone" aria-label="Jolie's phone"><button class="close" id="close-phone" aria-label="Close phone">×</button><div class="screen"><div class="status"><span id="status-time"></span><div class="speaker" aria-hidden="true"></div><span class="signals" aria-hidden="true"><svg viewBox="0 0 18 14"><path d="M2 12V9m4 3V6m4 6V3m4 9V1"/></svg><svg viewBox="0 0 18 14"><rect x="1" y="3" width="13" height="8" rx="2"/><path d="M16 5v4M3 5h9v4H3z"/></svg></span></div><div class="welcome"><div class="date" id="date"></div><div class="time" id="time"></div><p class="owner">jolie's phone ♡</p></div><nav class="apps" aria-label="Social apps">
<a class="app pinterest" href="https://pin.it/6OGUJFPHO" target="_blank" rel="noopener noreferrer"><span class="tile" aria-hidden="true">p</span><span>pinterest</span></a>
<a class="app tumblr" href="https://blueberry-daydreams.tumblr.com/" target="_blank" rel="noopener noreferrer"><span class="tile" aria-hidden="true">t</span><span>tumblr</span></a>
<a class="app instagram" href="https://www.instagram.com/itsjoliecannoli/" target="_blank" rel="noopener noreferrer"><span class="tile" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" rx="7"/><circle cx="16" cy="16" r="6"/><circle cx="23" cy="9" r="1"/></svg></span><span>instagram</span></a>
<a class="app linkedin" href="https://www.linkedin.com/in/joliesarro/" target="_blank" rel="noopener noreferrer"><span class="tile" aria-hidden="true">in</span><span>linkedin</span></a>
</nav><nav class="dock" aria-label="Phone shortcuts"><a class="app" href="/laptop1" id="laptop-shortcut"><span class="tile" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="17" rx="2"/><path d="M2 27h28l-3-5H5z"/></svg></span><span>laptop</span></a></nav><div class="home-line" aria-hidden="true"></div></div></main>
<script>
function tick(){const now=new Date();const time=now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});document.getElementById('time').textContent=time.replace(/\s?[AP]M/i,'');document.getElementById('status-time').textContent=time;document.getElementById('date').textContent=now.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'});}tick();setInterval(tick,1000);
document.getElementById('close-phone').addEventListener('click',()=>{try{if(parent!==window&&typeof parent.closePhone==='function'){parent.closePhone();return;}}catch(_){}location.href='/';});
</script></body></html>
