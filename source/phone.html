<!DOCTYPE html>

<head>

<title>Jolie's phone</title><link rel="icon" href="/assets/tab.png"><link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:#604565}body{padding:9px;background:transparent;display:flex;justify-content:center;align-items:center;cursor:url('/assets/cursor.gif'),auto}.phone{width:100%;height:100%;max-width:350px;max-height:690px;border:6px solid #a96588;border-radius:43px;padding:7px;background:linear-gradient(120deg,#ffe1ee,#f2accf);box-shadow:inset 0 0 0 2px #fff6,0 12px 30px #351f4333;position:relative}.screen{height:100%;border:2px solid #76516f;border-radius:30px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 80% 35%,#f9d9ef 0,transparent 48%),linear-gradient(160deg,#a9d8fa 15%,#cce8ff 50%,#fbb9df);display:flex;flex-direction:column}.screen:before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff9c 1px,transparent 1px);background-size:22px 22px}.status{height:38px;padding:12px 20px 0;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;position:relative}.speaker{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:67px;height:15px;background:#64455e;border-radius:20px;box-shadow:inset 0 2px 3px #0003}.speaker:after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:#a5c6df;margin:5px 8px}.signals{display:flex;gap:5px;align-items:center}.signals svg{width:15px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5}.welcome{position:relative;text-align:center;padding:28px 12px 16px}.date{font-size:12px;letter-spacing:.3px}.time{font-size:52px;font-weight:300;letter-spacing:-2px;margin:5px 0}.owner{font:22px VT323,monospace;margin:0}.apps{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:24px 16px;padding:15px 32px}.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:#604565;font-size:11px;min-width:0}.tile{width:57px;height:57px;display:grid;place-items:center;border:1px solid #fff9;border-radius:16px;box-shadow:0 4px 0 #77506a22,inset 0 1px 0 #fff8;transition:transform .15s;background:#fff8;color:#795370}.app:hover .tile{transform:translateY(-3px)}.app:focus-visible{outline:2px solid #785574;outline-offset:4px;border-radius:5px}.pinterest .tile{background:#f8a5c5;font:bold italic 41px Georgia,serif}.tumblr .tile{background:#b2c8e8;font:bold 43px Georgia,serif}.linkedin .tile{background:#b8dbed;font:bold 27px Arial;letter-spacing:-2px}.instagram .tile{background:linear-gradient(135deg,#d4b4ef,#f6b5d7,#ffd6aa)}.tile svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dock{position:relative;margin:auto 15px 23px;border:1px solid #fff8;border-radius:23px;background:#fff6;padding:14px 12px;display:flex;justify-content:space-around}.dock .tile{width:48px;height:48px;border-radius:14px}.home-line{width:90px;height:4px;background:#795370;border-radius:5px;position:absolute;bottom:9px;left:50%;transform:translateX(-50%)}.close{position:absolute;right:-7px;top:-7px;z-index:3;border:2px solid #a96588;background:#fff0f8;color:#795370;width:30px;height:30px;border-radius:50%;font:23px Arial;cursor:pointer}.close:hover{background:#ffc6e5}@media(max-height:530px){.welcome{padding:15px 10px 8px}.time{font-size:38px}.apps{gap:14px;padding-top:8px}.dock{margin-bottom:18px;padding:8px}.tile{width:48px;height:48px}}@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style></head>
<body><main class="phone" aria-label="Jolie's phone"><button class="close" id="close-phone" aria-label="Close phone">×</button><div class="screen"><div class="status"><span id="status-time"></span><div class="speaker" aria-hidden="true"></div><span class="signals" aria-hidden="true"><svg viewBox="0 0 18 14"><path d="M2 12V9m4 3V6m4 6V3m4 9V1"/></svg><svg viewBox="0 0 18 14"><rect x="1" y="3" width="13" height="8" rx="2"/><path d="M16 5v4M3 5h9v4H3z"/></svg></span></div><div class="welcome"><p class="owner">jolie's phone ♡</p></div><nav class="apps" aria-label="Social apps">

</nav><style>.flappy-widget{position:relative;margin:24px 16px 22px;min-height:120px;flex:1;border:2px solid #a77b9a;border-radius:17px;overflow:hidden;background:#badff4;box-shadow:0 3px 0 #79537022}.flappy-widget canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;touch-action:none;cursor:pointer}.flappy-widget:focus-within{outline:2px solid #795370;outline-offset:3px}@media(max-height:530px){.flappy-widget{margin-top:10px}}</style>
<section class="flappy-widget" aria-label="Flappy bird game"><canvas id="flappy" width="280" height="240" tabindex="0" aria-label="Flappy bird: tap or press Space to flap. Tap again after game over to restart."></canvas><span id="flappy-status" role="status" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">tap to play</span></section>
<div class="home-line" aria-hidden="true"></div></div></main>
<script>
function tick(){const now=new Date();const time=now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});document.getElementById('status-time').textContent=time;}tick();setInterval(tick,1000);
document.getElementById('close-phone').addEventListener('click',()=>{try{if(parent!==window&&typeof parent.closePhone==='function'){parent.closePhone();return;}}catch(_){}location.href='/';});
</script><script>
(()=>{
const canvas=document.getElementById('flappy'),ctx=canvas.getContext('2d'),status=document.getElementById('flappy-status');let state='ready',y=110,velocity=0,pipes=[],score=0,best=0,last=0,elapsed=0;try{best=Number(localStorage.getItem('picnic_flappy_best'))||0;}catch(_){}
function flap(){canvas.focus();if(state!=='playing'){state='playing';y=110;velocity=0;pipes=[];score=0;elapsed=0;status.textContent='playing';}velocity=-160;}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap();});canvas.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.key==='Enter'){e.preventDefault();e.stopPropagation();if(!e.repeat)flap();}});
function end(){state='over';best=Math.max(best,score);try{localStorage.setItem('picnic_flappy_best',String(best));}catch(_){}status.textContent=`game over. score ${score}, best ${best}. tap to restart`;}
function frame(t){const dt=Math.min((t-last)/1000||0,.035);last=t;if(state==='playing'&&!document.hidden){elapsed+=dt;velocity+=420*dt;y+=velocity*dt;if(elapsed>1.65){elapsed=0;pipes.push({x:280,gap:52+Math.random()*77,scored:false});}for(const p of pipes){p.x-=80*dt;if(!p.scored&&p.x+34<65){p.scored=true;score++;status.textContent=`score ${score}`;}if(75>p.x&&55<p.x+34&&(y-9<p.gap||y+9>p.gap+85))end();}pipes=pipes.filter(p=>p.x>-40);if(y<9||y>211)end();}
ctx.fillStyle='#bbdff3';ctx.fillRect(0,0,280,240);ctx.fillStyle='#fff9';for(const x of [25,145,235]){ctx.fillRect(x,43,35,8);ctx.fillRect(x+8,36,20,8);}for(const p of pipes){ctx.fillStyle='#8dbaaa';ctx.fillRect(p.x,0,34,p.gap);ctx.fillRect(p.x,p.gap+85,34,135-p.gap);ctx.fillStyle='#739b8e';ctx.fillRect(p.x-3,p.gap-10,40,10);ctx.fillRect(p.x-3,p.gap+85,40,10);}ctx.fillStyle='#f5c2d8';ctx.fillRect(0,220,280,20);ctx.fillStyle='#d597b5';ctx.fillRect(0,220,280,3);
ctx.save();ctx.translate(65,y);ctx.rotate(Math.max(-.3,Math.min(.6,velocity/400)));ctx.fillStyle='#795370';ctx.fillRect(-12,-9,23,18);ctx.fillStyle='#f8d48c';ctx.fillRect(-10,-7,19,14);ctx.fillStyle='#eeb5ce';ctx.fillRect(-13,1,12,7);ctx.fillStyle='#fff';ctx.fillRect(3,-6,7,7);ctx.fillStyle='#604565';ctx.fillRect(7,-4,3,3);ctx.fillStyle='#df9a87';ctx.fillRect(10,1,8,4);ctx.restore();ctx.fillStyle='#604565';ctx.font='16px VT323,monospace';ctx.textAlign='left';ctx.fillText(`score ${score}`,12,20);ctx.textAlign='right';ctx.fillText(`best ${best}`,268,20);
if(state!=='playing'){ctx.fillStyle='#fff0f8e8';ctx.fillRect(36,143,208,49);ctx.fillStyle='#604565';ctx.textAlign='center';ctx.font='22px VT323,monospace';ctx.fillText(state==='ready'?'flappy bird ♡':'game over',140,164);ctx.font='16px VT323,monospace';ctx.fillText(state==='ready'?'tap / space to flap':'tap to try again',140,183);}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body></html>
