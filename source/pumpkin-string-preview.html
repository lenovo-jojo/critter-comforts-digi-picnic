<!doctype html><html><head><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const scene=new T.Scene(),camera=new T.OrthographicCamera(0,1,1,0,.1,1000),renderer=new T.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);camera.position.z=500;scene.add(new T.HemisphereLight(0xffe3c0,0x695776,2));const g=await new GLTFLoader().loadAsync('/assets/pumpkin-string-bulb.glb');g.scene.traverse(o=>{if(o.isMesh){const box=new T.Box3(),v=new T.Vector3(),geo=o.geometry;for(let j=0;j<geo.index.count;j++)box.expandByPoint(v.fromBufferAttribute(geo.attributes.position,geo.index.getX(j)));geo.boundingBox=box;geo.boundingSphere=box.getBoundingSphere(new T.Sphere());}});let box=new T.Box3().setFromObject(g.scene),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3());g.scene.position.sub(center);const bulbs=[],cordMat=new T.LineBasicMaterial({color:0x3d3040});let cord;

layout();addEventListener('resize',layout);let last=0;function draw(ms){requestAnimationFrame(draw);if(document.hidden||ms-last<120)return;last=ms;const night=parent.document.documentElement.classList.contains('picnic-night');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const breeze=Math.pow(Math.max(0,Math.sin(ms/1000*.36)),7)*1.4-Math.pow(Math.max(0,Math.sin(ms/1000*.23+2)),10)*.65;for(let i=0;i<bulbs.length;i++){bulbs[i].rotation.z=bulbs[i].userData.restZ+(reduced?0:breeze*.075+Math.sin(ms/1000*1.35+i*.45)*.018);}for(const b of bulbs)b.traverse(o=>{if(o.isMesh)for(const m of(Array.isArray(o.material)?o.material:[o.material]))m.emissiveIntensity=night?1.8:.55;});renderer.render(scene,camera);}requestAnimationFrame(draw);
