<!doctype html><html><head><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const scene=new T.Scene(),camera=new T.OrthographicCamera(-1,1,1,-1,.01,100),renderer=new T.WebGLRenderer({alpha:true,antialias:false});renderer.setPixelRatio(1);document.body.append(renderer.domElement);camera.position.z=5;scene.add(new T.HemisphereLight(0xfff7e9,0x8390ae,2));const light=new T.DirectionalLight(0xffffff,1.4);light.position.set(-2,4,5);scene.add(light);const g=await new GLTFLoader().loadAsync('/assets/stylized-clouds.glb');g.scene.updateMatrixWorld(true);const meshes=[];g.scene.traverse(o=>{if(o.isMesh)meshes.push(o);});const clouds=[0,4,9].map((index,i)=>{const src=meshes[index],geo=src.geometry.clone().applyMatrix4(src.matrixWorld);geo.computeBoundingBox();const size=geo.boundingBox.getSize(new T.Vector3()),center=geo.boundingBox.getCenter(new T.Vector3());geo.translate(-center.x,-center.y,-center.z);geo.scale(.38/Math.max(size.x,size.y,size.z),.38/Math.max(size.x,size.y,size.z),.38/Math.max(size.x,size.y,size.z));const material=(Array.isArray(src.material)?src.material[0]:src.material).clone();material.transparent=true;material.opacity=.8;material.alphaTest=.05;material.side=T.DoubleSide;material.depthWrite=false;const mesh=new T.Mesh(geo,material);mesh.rotation.x=Math.PI/2-.15;scene.add(mesh);return {mesh,start:-.45+i*.45,y:.86-i*.13,speed:.012+i*.002};});parent.postMessage({type:'stylized-clouds-ready'},location.origin);let last=0;function frame(ms){requestAnimationFrame(frame);if(document.hidden||ms-last<80)return;last=ms;const w=innerWidth,h=innerHeight,aspect=w/h;renderer.setSize(Math.round(w/2),Math.round(h/2),false);camera.left=-aspect;camera.right=aspect;camera.updateProjectionMatrix();const night=parent.document.documentElement.classList.contains('picnic-night'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;for(const c of clouds){c.mesh.position.set(((c.start+(reduced?0:ms/1000*c.speed)+aspect+.6)%(2*aspect+1.2))-aspect-.6,c.y,0);c.mesh.material.color.setHex(night?0x78829f:0xf0e9df);c.mesh.material.opacity=night?.32:.8;}renderer.render(scene,camera);}requestAnimationFrame(frame);
</script></body></html>
