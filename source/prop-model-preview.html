<!doctype html><html><head><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const kind=new URLSearchParams(location.search).get('kind')==='phone'?'phone':'camera',scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.001,1000),renderer=new THREE.WebGLRenderer({alpha:true,antialias:kind!=='camera'});renderer.setPixelRatio(kind==='camera'?1:Math.min(devicePixelRatio,2));if(kind==='camera')renderer.domElement.style.imageRendering='pixelated';document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xfff4e8,0x887281,2));const light=new THREE.DirectionalLight(0xfff6ed,1.0);light.position.set(-3,6,5);scene.add(light);let extent=1;
new GLTFLoader().load('/assets/'+kind+'-preview.glb',g=>{const model=g.scene;if(kind==='phone'){const root=model.children[0];root.matrixAutoUpdate=true;root.position.set(0,0,0);root.quaternion.identity();root.scale.set(1,1,1);root.updateMatrix();}else model.traverse(o=>{if(o.isMesh)for(const m of (Array.isArray(o.material)?o.material:[o.material])){m.roughness=1;m.metalness=0;if(m.normalScale)m.normalScale.set(.15,.15);m.aoMapIntensity=.35;m.onBeforeCompile=shader=>{shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>',`#include <map_fragment>
float warm=step(diffuseColor.b*1.12,diffuseColor.r)*step(0.1,diffuseColor.r)*step(diffuseColor.b*1.03,diffuseColor.g);float lum=dot(diffuseColor.rgb,vec3(.299,.587,.114));diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.47,.91,.85)*(.88+.12*lum),warm);`);};}});scene.add(model);let box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());model.position.sub(center);const r=Math.max(size.x,size.y,size.z);if(kind==='phone'){const tex=new THREE.TextureLoader().load('/assets/phone-wallpaper.jpg');tex.colorSpace=THREE.SRGBColorSpace;const panel=new THREE.Mesh(new THREE.PlaneGeometry(size.z*.78,size.x*.80),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));const bezel=new THREE.Mesh(new THREE.PlaneGeometry(size.z*.89,size.x*.90),new THREE.MeshBasicMaterial({color:0x242331,side:THREE.DoubleSide}));bezel.rotation.set(-Math.PI/2,0,Math.PI/2);bezel.position.set(0,size.y/2+.003,0);const home=new THREE.Mesh(new THREE.BoxGeometry(size.x*.018,.005,size.z*.24),new THREE.MeshBasicMaterial({color:0x292632}));home.position.set(size.x*.44,size.y/2+.009,0);scene.add(home);scene.add(bezel);panel.rotation.set(-Math.PI/2,0,Math.PI/2);panel.position.set(0,size.y/2+.006,0);scene.add(panel);}if(kind==='phone'){camera.position.set(r*.25,r*1.8,r*3);camera.up.set(.35,1,0);}else camera.position.set(r*.5,r*1.1,-r*2);camera.lookAt(0,0,0);camera.updateMatrixWorld();box=new THREE.Box3().setFromObject(model);const projected=new THREE.Box3();for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z])projected.expandByPoint(new THREE.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse));extent=Math.max(Math.abs(projected.min.x),Math.abs(projected.max.x),Math.abs(projected.min.y),Math.abs(projected.max.y))*1.1;camera.far=r*30;if(kind==='phone')scene.rotation.y=Math.PI;});
function frame(){const w=innerWidth,h=innerHeight;const rw=kind==='camera'?Math.max(48,Math.round(w/3)):w,rh=kind==='camera'?Math.max(40,Math.round(h/3)):h;if(renderer.domElement.width!==Math.round(rw*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(rh*renderer.getPixelRatio()))renderer.setSize(rw,rh,false);const sy=extent*Math.max(1,h/w);camera.left=-sy*w/h;camera.right=sy*w/h;camera.top=sy;camera.bottom=-sy;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(frame);}frame();
</script></body></html>
